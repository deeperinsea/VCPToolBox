name: upstream-image

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: upstream-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api repos/lioensky/VCPToolBox/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "upstream=$sha"
          image="ghcr.io/deeperinsea/vcptoolbox:${sha}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "already published: $image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "will build: $image"
          fi

      - name: Free disk space
        if: steps.up.outputs.exists == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          df -h

      - name: Set up Buildx
        if: steps.up.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.up.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/lioensky/VCPToolBox.git#${{ steps.up.outputs.sha }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/deeperinsea/vcptoolbox:${{ steps.up.outputs.sha }}
            ghcr.io/deeperinsea/vcptoolbox:main
          labels: |
            org.opencontainers.image.source=https://github.com/deeperinsea/VCPToolBox
            org.opencontainers.image.url=https://github.com/lioensky/VCPToolBox
            org.opencontainers.image.revision=${{ steps.up.outputs.sha }}
            org.opencontainers.image.licenses=LicenseRef-CC-BY-NC-SA-4.0
            org.opencontainers.image.description=Personal image of lioensky/VCPToolBox
            org.opencontainers.image.title=VCPToolBox

      - name: Make the package public
        if: steps.up.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT /user/packages/container/vcptoolbox/visibility -f visibility=public \
            || echo "visibility change skipped"
